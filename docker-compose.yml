services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: customer_support_backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: sqlite:////app/customer_support.db

    volumes:
      - ./customer_support.db:/app/customer_support.db
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: customer_support_frontend

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      API_BASE_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped